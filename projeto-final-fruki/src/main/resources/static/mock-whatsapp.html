<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08743e">
  <meta name="description" content="Simulação da conversa do WhatsApp do Pede Fruki com link para o catálogo B2B.">
  <title>WhatsApp · Pede Fruki</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(169, 223, 56, .2), transparent 28rem),
        radial-gradient(circle at 82% 88%, rgba(0, 40, 23, .34), transparent 32rem),
        linear-gradient(135deg, #08743e, #075b35 55%, #0a7944);
      color: #153629;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: 0;
      opacity: .2;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 34px, #004326 35px 37px),
        repeating-linear-gradient(90deg, transparent 0 34px, #004326 35px 37px);
      filter: blur(.7px);
      transform: rotate(-4deg);
      animation: drift 40s linear infinite;
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      min-height: 100svh;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .phone {
      position: relative;
      width: min(100vw, calc(100vh * 0.5058));
      width: min(100vw, calc(100svh * 0.5058));
      aspect-ratio: 2180 / 4310;
      filter: drop-shadow(0 30px 46px rgba(0, 28, 15, .42));
    }
    .frame {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    /* Full-bleed: o verde preenche todo o vidro e a moldura por cima recorta a ilha preta. */
    .screen {
      position: absolute;
      left: 3.5%;
      right: 4.5%;
      top: 2.4%;
      bottom: 1.5%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 0;
      background: #08745a;
      box-shadow: none;
    }

    .status {
      display: flex;
      flex: none;
      height: 44px;
      justify-content: space-between;
      padding: 16px 22px 0;
      background: #08745a;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }
    .head {
      display: flex;
      flex: none;
      align-items: center;
      gap: 10px;
      padding: 8px 20px 12px;
      background: #08745a;
      color: #fff;
    }
    .avatar {
      display: grid;
      width: 40px;
      height: 40px;
      flex: none;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: #fff;
    }
    .avatar img { width: 85%; height: 85%; object-fit: contain; }
    .name { font-size: 16px; font-weight: 850; line-height: 1.15; }
    .online { margin-top: 2px; font-size: 12px; opacity: .9; }

    .chat {
      flex: 1;
      overflow: auto;
      padding: 14px 20px;
      background-color: #ece8df;
      background-image: radial-gradient(#cbd3c2 .7px, transparent .7px);
      background-size: 14px 14px;
      scrollbar-width: none;
    }
    .chat::-webkit-scrollbar { display: none; }

    .date {
      width: max-content;
      margin: 3px auto 14px;
      padding: 5px 10px;
      border-radius: 10px;
      background: #fbfaf5;
      color: #405649;
      font-size: 11px;
      text-align: center;
    }
    .bubble {
      max-width: 92%;
      margin: 8px 0;
      padding: 10px 12px;
      overflow-wrap: anywhere;
      border-radius: 14px;
      background: #fff;
      color: #24372c;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 1px 2px #10271a18;
      animation: pop .22s ease-out;
    }
    .bubble.user { margin-left: auto; border-top-right-radius: 4px; background: #d8f8c5; }
    .bubble.bot { border-top-left-radius: 4px; }
    .time { display: block; margin-top: 4px; color: #5a7161; font-size: 10px; text-align: right; }
    .items { margin: 5px 0 0; padding-left: 17px; }
    .items li { margin: 7px 0; }
    .reasons { color: #496353; font-size: 12px; }

    .bubble.offer-wrap { max-width: 96%; padding: 0; background: transparent; box-shadow: none; }
    .offer-card { overflow: hidden; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px #10271a20; }
    .offer-art {
      position: relative;
      min-height: 124px;
      padding: 17px;
      color: #fff;
      background:
        radial-gradient(circle at 88% 18%, #c8ef77 0 7%, transparent 7.5%),
        linear-gradient(120deg, #00552f, #008149 65%, #74b82a);
    }
    .offer-kicker { color: #d5ff8b; font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .offer-title { max-width: 205px; margin: 7px 0 0; font-size: 20px; font-weight: 900; line-height: 1.12; }
    .offer-copy { margin: 7px 0 0; color: #efffe9; font-size: 12px; }
    .offer-products { padding: 11px 13px 4px; color: #263c30; font-size: 12px; line-height: 1.45; }
    .offer-products strong { color: #075b34; }
    .offer-action {
      display: block;
      margin: 10px 12px 12px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #08783f;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 850;
    }
    .home { width: 95px; height: 4px; margin: 6px auto 12px; flex: none; border-radius: 8px; background: #161616; }

    .tools {
      position: fixed;
      z-index: 5;
      right: 18px;
      top: 18px;
      display: flex;
      gap: 8px;
    }
    .tools button {
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, .95);
      color: #075b34;
      padding: 10px 14px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0, 34, 20, .18);
      transition: transform .18s ease, background .18s ease;
    }
    .tools button:hover { background: #fff; transform: translateY(-1px); }
    .tools button:disabled { cursor: wait; opacity: .65; }

    .error {
      position: fixed;
      z-index: 5;
      bottom: 12px;
      left: 12px;
      right: 12px;
      color: #fff;
      font-size: 13px;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    }
    .error:empty { display: none; }

    @keyframes drift { to { background-position: 140px 70px; } }
    @keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    @media (max-width: 460px) {
      .stage { padding: 0; }
      .phone { width: min(100vw, calc(100vh * 0.5058)); width: min(100vw, calc(100svh * 0.5058)); }
      .tools { right: 10px; top: 10px; }
      .tools button { padding: 8px 10px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="tools"><button id="replay" type="button">Reproduzir conversa</button></div>

  <main class="stage">
    <div class="phone" aria-label="Simulação de conversa do WhatsApp Pede Fruki">
      <img class="frame" src="/images/brand/iphone-frame-overlay.png" alt="">
      <section class="screen">
        <div class="status"><span>9:41</span><span>●●● Wi-Fi 100%</span></div>
        <header class="head">
          <div class="avatar"><img src="/catalogo-app/assets/logo.webp" alt=""></div>
          <div>
            <div class="name">Pede Fruki</div>
            <div class="online">atendimento B2B · online</div>
          </div>
        </header>
        <div class="chat" id="chat" aria-live="polite"><div class="date">HOJE</div></div>
        <div class="home"></div>
      </section>
    </div>
  </main>

  <div class="error" id="error" role="alert"></div>

  <script>
    const API = (new URLSearchParams(location.search).get('api') || location.origin).replace(/\/$/, '');
    const chat = document.querySelector('#chat');
    const encode = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function bubble(content, side = 'bot', html = false) {
      const node = document.createElement('div');
      node.className = `bubble ${side}`;
      node.innerHTML = `${html ? content : encode(content)}<span class="time">agora</span>`;
      chat.append(node);
      chat.scrollTop = chat.scrollHeight;
    }

    async function simulate() {
      document.querySelector('#error').textContent = '';
      document.querySelector('#replay').disabled = true;
      chat.innerHTML = '<div class="date">HOJE</div>';
      try {
        const response = await fetch(`${API}/mock/demo`, { headers: { Accept: 'application/json' } });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || `Erro ${response.status}`);

        bubble('Oi! 👋 Quero fazer um pedido.', 'user'); await wait(450);
        bubble('Olá! 🥤 Bem-vindo ao Pede Fruki. Para localizar sua loja, informe o CNPJ.'); await wait(650);
        bubble(data.cnpj, 'user'); await wait(450);
        bubble(`✅ ${data.nome} identificado! Cadastro confirmado para ${data.regiao}.`); await wait(600);
        bubble(`Olá, ${data.nome}! 🎉 Separei sugestões com bom potencial de venda para sua loja.`); await wait(500);

        const items = data.recomendacoes?.itens || [];
        const list = items.map((item) => {
          const motivos = (item.motivos || []).filter((motivo) => !/sazonalidade/i.test(motivo));
          return `<li><strong>${encode(item.nome)}</strong>${motivos.length ? `<br><span class="reasons">${encode(motivos.join(' · '))}</span>` : ''}</li>`;
        }).join('');
        bubble(`<strong>💡 Sugestões para ${encode(data.nome)}</strong><ul class="items">${list || '<li>Novas sugestões estarão disponíveis em breve.</li>'}</ul>`, 'bot', true);
        await wait(700);

        const destaques = items.slice(0, 3).map((item) => encode(item.nome)).join(' · ');
        bubble(`<div class="offer-card"><div class="offer-art"><div class="offer-kicker">✨ Seleção especial Pede Fruki</div><div class="offer-title">Mais giro para a sua loja!</div><p class="offer-copy">Sugestões escolhidas para o perfil da ${encode(data.nome)}.</p></div><div class="offer-products">🥤 <strong>Para conhecer:</strong><br>${destaques || 'Confira as novidades do catálogo.'}<br><br>Monte seus fardos e veja os preços no catálogo.</div><a class="offer-action" href="${encode(data.catalogoUrl)}">Abrir catálogo e fazer pedido&nbsp; →</a></div>`, 'bot', true);
      } catch (error) {
        document.querySelector('#error').textContent = `Não foi possível carregar a conversa: ${error.message}. Confira se o Spring Boot está rodando.`;
      } finally {
        document.querySelector('#replay').disabled = false;
      }
    }

    document.querySelector('#replay').addEventListener('click', simulate);
    simulate();
  </script>
</body>
</html>
