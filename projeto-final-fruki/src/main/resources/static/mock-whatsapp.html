<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08743e">
  <title>WhatsApp · Pede Fruki</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden;background:linear-gradient(135deg,#08743e,#075b35 55%,#0a7944);color:#153629}body:before{content:"";position:fixed;inset:-20%;z-index:-1;opacity:.23;background-image:repeating-linear-gradient(0deg,transparent 0 34px,#004326 35px 37px),repeating-linear-gradient(90deg,transparent 0 34px,#004326 35px 37px);filter:blur(.7px);transform:rotate(-4deg);animation:drift 40s linear infinite}.phone{position:relative;width:min(390px,94vw);aspect-ratio:2180/4310;filter:drop-shadow(0 24px 38px #00281766)}.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none}.screen{position:absolute;left:6.3%;right:6.3%;top:7.8%;bottom:4.2%;overflow:hidden;border-radius:10%/4%;background:#ece8df;display:flex;flex-direction:column}.status{height:35px;flex:none;padding:8px 22px 0;background:#08745a;color:white;font-size:12px;font-weight:800;display:flex;justify-content:space-between}.head{display:flex;align-items:center;gap:10px;padding:8px 15px 12px;color:white;background:#08745a}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:white;overflow:hidden}.avatar img{width:85%;height:85%;object-fit:contain}.name{font-size:16px;font-weight:850}.online{font-size:12px;margin-top:2px}.chat{flex:1;overflow:auto;padding:12px;background-color:#ece8df;background-image:radial-gradient(#cbd3c2 .7px,transparent .7px);background-size:14px 14px}.date{text-align:center;width:max-content;margin:3px auto 14px;padding:5px 10px;border-radius:10px;background:#fbfaf5;color:#405649;font-size:11px}.bubble{max-width:92%;margin:8px 0;padding:10px 12px;border-radius:14px;background:white;color:#24372c;font-size:13px;line-height:1.45;box-shadow:0 1px 2px #10271a18;overflow-wrap:anywhere;animation:pop .22s ease-out}.bubble.user{margin-left:auto;background:#d8f8c5;border-top-right-radius:4px}.bubble.bot{border-top-left-radius:4px}.time{display:block;text-align:right;margin-top:4px;color:#5a7161;font-size:10px}.items{margin:5px 0 0;padding-left:17px}.items li{margin:7px 0}.reasons{color:#496353;font-size:12px}.link{display:inline-block;margin-top:5px;color:#075b34;font-weight:800}.home{width:95px;height:4px;margin:6px auto;border-radius:8px;background:#161616;flex:none}.tools{position:fixed;right:18px;top:18px;display:flex;gap:8px}.tools button{border:0;border-radius:12px;background:#f4fbf4;color:#075b34;padding:10px 14px;font-weight:800;cursor:pointer}.error{position:fixed;bottom:12px;left:12px;right:12px;text-align:center;color:white;font-size:13px}.error:empty{display:none}@keyframes drift{to{background-position:140px 70px}}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-height:680px){.phone{width:min(330px,88vw)}}
  /* Fundo removido da arte do aparelho; a tela ocupa a área interna do vidro. */
  .frame{mix-blend-mode:normal}
  .screen{left:6.3%;right:6.3%;top:7.8%;bottom:4.2%;border-radius:10%/4%;}
  .bubble.offer-wrap{padding:0;background:transparent;box-shadow:none;max-width:96%;}
  .offer-card{overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 2px 8px #10271a20}
  .offer-art{position:relative;min-height:124px;padding:17px;color:#fff;background:radial-gradient(circle at 88% 18%,#c8ef77 0 7%,transparent 7.5%),linear-gradient(120deg,#00552f,#008149 65%,#74b82a);}
  .offer-kicker{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#d5ff8b}
  .offer-title{max-width:205px;margin:7px 0 0;font-size:20px;font-weight:900;line-height:1.12}
  .offer-copy{margin:7px 0 0;font-size:12px;color:#efffe9}
  .offer-products{padding:11px 13px 4px;color:#263c30;font-size:12px;line-height:1.45}
  .offer-products strong{color:#075b34}
  .offer-action{display:block;margin:10px 12px 12px;padding:10px 12px;border-radius:9px;background:#08783f;color:#fff;text-align:center;text-decoration:none;font-size:13px;font-weight:850}
  .link-preview{display:block;margin-top:7px;padding:11px;border-radius:10px;background:#e8f5e6;color:#0a5330;text-decoration:none;overflow-wrap:anywhere}
  .link-preview strong{display:block;margin-bottom:3px;font-size:13px}
  .link-preview span{font-size:11px;text-decoration:underline}
  .chat{scrollbar-width:none}.chat::-webkit-scrollbar{display:none}
  @media(max-height:680px){.phone{width:min(330px,88vw)}}
  </style>
</head>
<body>
  <div class="tools"><button id="replay" type="button">Reproduzir conversa</button></div>
  <main class="phone" aria-label="Simulação de conversa do WhatsApp Pede Fruki">
    <img class="frame" src="/images/brand/iphone-frame-transparent.png" alt="">
    <section class="screen">
      <div class="status"><span>9:41</span><span>●●● Wi-Fi 100%</span></div>
      <header class="head"><div class="avatar"><img src="/catalogo-app/assets/logo.webp" alt=""></div><div><div class="name">Pede Fruki</div><div class="online">atendimento B2B · online</div></div></header>
      <div class="chat" id="chat" aria-live="polite"><div class="date">HOJE</div></div>
      <div class="home"></div>
    </section>
  </main>
  <div class="error" id="error" role="alert"></div>
  <script>
    const API = (new URLSearchParams(location.search).get('api') || location.origin).replace(/\/$/, '');
    const chat = document.querySelector('#chat');
    const encode = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    function bubble(content, side = 'bot', html = false) {
      const node = document.createElement('div'); node.className = `bubble ${side}`;
      node.innerHTML = `${html ? content : encode(content)}<span class="time">agora</span>`;
      chat.append(node); chat.scrollTop = chat.scrollHeight;
    }
    async function simulate() {
      document.querySelector('#error').textContent = '';
      document.querySelector('#replay').disabled = true;
      chat.innerHTML = '<div class="date">HOJE</div>';
      try {
        const response = await fetch(`${API}/mock/demo`, {headers:{Accept:'application/json'}});
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `Erro ${response.status}`);
        bubble('Oi! 👋 Quero fazer um pedido.', 'user'); await wait(450);
        bubble('Olá! 🥤 Bem-vindo ao Pede Fruki. Para localizar sua loja, informe o CNPJ.'); await wait(650);
        bubble(data.cnpj, 'user'); await wait(450);
        bubble(`✅ ${data.nome} identificado! Cadastro confirmado para ${data.regiao}.`); await wait(600);
        bubble(`Olá, ${data.nome}! 🎉 Separei sugestões com bom potencial de venda para sua loja.`); await wait(500);
        const items = data.recomendacoes?.itens || [];
        const list = items.map((item) => `<li><strong>${encode(item.nome)}</strong><br><span class="reasons">${encode((item.motivos || []).join(' · '))}</span></li>`).join('');
        bubble(`<strong>💡 Sugestões para ${encode(data.nome)}</strong><ul class="items">${list || '<li>Novas sugestões estarão disponíveis em breve.</li>'}</ul>`, 'bot', true);
        await wait(700);
        const destaques = items.slice(0, 3).map((item) => encode(item.nome)).join(' · ');
        bubble(`<div class="offer-card"><div class="offer-art"><div class="offer-kicker">✨ Seleção especial Pede Fruki</div><div class="offer-title">Mais giro para a sua loja!</div><p class="offer-copy">Sugestões escolhidas para o perfil da ${encode(data.nome)}.</p></div><div class="offer-products">🥤 <strong>Para conhecer:</strong><br>${destaques || 'Confira as novidades do catálogo.'}<br><br>Monte seus fardos e veja os preços no catálogo.</div><a class="offer-action" href="${encode(data.catalogoUrl)}">Ver ofertas para minha loja&nbsp; →</a></div>`, 'bot', true);
        await wait(450);
        bubble(`📦 Seu catálogo personalizado está pronto, ${encode(data.nome)}! Toque no link para escolher os produtos e montar seus fardos.`);
        bubble(`<a class="link-preview" href="${encode(data.catalogoUrl)}"><strong>🥤 Catálogo Pede Fruki</strong><span>Abrir catálogo e fazer pedido →</span></a>`, 'bot', true);
      } catch (error) { document.querySelector('#error').textContent = `Não foi possível carregar a conversa: ${error.message}. Confira se o Spring Boot está rodando.`; }
      finally { document.querySelector('#replay').disabled = false; }
    }
    document.querySelector('#replay').addEventListener('click', simulate);
    simulate();
  </script>
</body>
</html>
