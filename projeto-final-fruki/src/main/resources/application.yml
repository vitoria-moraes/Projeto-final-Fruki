# =====================================================================================
# Projeto Final Fruki | Configuração Multi-DataSource (Supabase + Databricks)
# =====================================================================================
server:
  port: 8080
  # SEM context-path: os controllers já declaram /api/v1/... (com context-path ficava /api/v1/api/v1/...)

spring:
  application:
    name: projeto-final-fruki

  jpa:
    open-in-view: false            # evita manter conexão aberta durante a renderização da view
    hibernate:
      ddl-auto: none               # o schema é do Supabase/Flyway, nunca do Hibernate
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true

  cache:
    type: simple

  # ---- PRIMÁRIO: PostgreSQL / Supabase --------------------------------------------------
  # ATENÇÃO: o DataSource é um HikariDataSource ligado DIRETAMENTE por @ConfigurationProperties.
  # O Hikari usa 'jdbc-url' em vez de 'url'.
  datasource:
    jdbc-url: ${SUPABASE_JDBC_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SUPABASE_USER:postgres.atgvruhbnotkbtksounj}
    password: ${SUPABASE_PASSWORD:2Z3.XyCB3uqFnfx}
    driver-class-name: org.postgresql.Driver
    pool-name: pg-pool
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 20000
    max-lifetime: 1500000          # menor que o timeout do pooler do Supabase

# ---- SECUNDÁRIO: Databricks (SQL Warehouse) via JDBC -------------------------------------
# ---- SECUNDÁRIO: Databricks (SQL Warehouse) via JDBC -------------------------------------
databricks:
  datasource:
    # EnableArrow=0: o formato Arrow do driver exige --add-opens do JVM no Java 17+ e derruba a 1ª consulta
    jdbc-url: jdbc:databricks://${DATABRICKS_HOST:dbc-17ab845d-5dec.cloud.databricks.com}:443/default;transportMode=http;ssl=1;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH:/sql/1.0/warehouses/12a3d330422a5dce};EnableArrow=0
    driver-class-name: com.databricks.client.jdbc.Driver
    # O driver espera UID/PWD (UID = literal "token", PWD = o token)
    data-source-properties:
      UID: token
      token: ${DATABRICKS_TOKEN}
    pool-name: databricks-pool
    maximum-pool-size: 3           # o warehouse não é um banco transacional: poucas conexões bastam
    minimum-idle: 0                # NÃO abrir conexões no boot (acordaria o warehouse parado)
    initialization-fail-timeout: -1  # o app sobe mesmo com o Databricks fora do ar; falha só na 1ª consulta
    connection-timeout: 120000     # cold start do warehouse pode levar > 30s (padrão do Hikari)
    validation-timeout: 15000
    idle-timeout: 120000
    max-lifetime: 1500000
    connection-test-query: SELECT 1   # o driver não implementa isValid() de forma confiável
    auto-commit: true              # o driver não suporta transação JDBC

app:
  databricks:
    # tabela (catalog.schema.tabela) lida pelo RecomendacaoRepository
    recomendacao-table: fruki.gold.gold_recomendacao_b2b