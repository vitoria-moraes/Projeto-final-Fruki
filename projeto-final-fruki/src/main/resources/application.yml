server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/equitech
    username: postgres
    password: '123'
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50

  # Configuração de Cache em Memória
  cache:
    type: simple

# Chaves de APIs Externas
api:
  weather:
    key: ${WEATHER_API_KEY:sua_chave_aqui}
    url: https://api.openweathermap.org/data/2.5