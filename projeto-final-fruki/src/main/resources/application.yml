server:
  port: 8080

spring:
  application:
    name: projeto-final-fruki

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: false
        jdbc.batch_size: 50
        order_inserts: true

  cache:
    type: simple

  datasource:
    jdbc-url: ${SUPABASE_JDBC_URL}
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    pool-name: pg-pool
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 5000
    max-lifetime: 1500000
    data-source-properties:
      connectTimeout: 5
      socketTimeout: 10

databricks:
  datasource:
    jdbc-url: jdbc:databricks://${DATABRICKS_HOST:dbc-17ab845d-5dec.cloud.databricks.com}:443/default;transportMode=http;ssl=1;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH:/sql/1.0/warehouses/12a3d330422a5dce};EnableArrow=0
    driver-class-name: com.databricks.client.jdbc.Driver
    data-source-properties:
      UID: token
      PWD: ${DATABRICKS_TOKEN:}
    pool-name: databricks-pool
    maximum-pool-size: 3
    minimum-idle: 0
    initialization-fail-timeout: -1
    connection-timeout: 120000
    validation-timeout: 15000
    idle-timeout: 120000
    max-lifetime: 1500000
    connection-test-query: SELECT 1
    auto-commit: true

app:
  databricks:
    recomendacao-table: ${DATABRICKS_RECOMENDACAO_TABLE:fruki.gold.gold_recomendacao_b2b}
  catalogo:
    base-url: ${CATALOGO_BASE_URL:http://localhost:8080}
  recomendacao:
    limite-padrao: 10
    janela-compra-recente-dias: 7
    pesos:
      rfm: 0.50
      regional: 0.20
      sazonalidade: 0.15
      margem: 0.15
    penalidades:
      comprado-recente: 15.0
      preco-outlier: 20.0
      dado-incompleto: 5.0
    diversidade:
      max-por-categoria: 2

api:
  weather:
    key: ${OPENWEATHER_KEY:}
    url: https://api.openweathermap.org/data/2.5

evolution:
  url: ${EVOLUTION_URL:http://localhost:8081}
  instance: ${EVOLUTION_INSTANCE:}
  api-key: ${EVOLUTION_API_KEY:}
  webhook-token: ${EVOLUTION_WEBHOOK_TOKEN:}

jwt:
  secret: ${JWT_SECRET:}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:7200}
